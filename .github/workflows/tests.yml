name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    # Python 3.9 has no build for Ubuntu 26.04 (what ubuntu-latest points to since 2026-10-21), so pin 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v